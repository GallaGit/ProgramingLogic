<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Convertidor</title>
</head>
<body>
    <div>
        <h2>Convertidor Universal</h2>

        <label for="convUniv">Convertidor Universal</label>
        <input type="text" id="convUniv" name="convUniversal">
        
        <select name="Convertidor" id="convType">
            <option value="CtoF">°C a °F</option>
            <option value="FtoC">°F a °C</option>
            <option value="Kg">Kg a lb</option>
            <option value="Lb">lb a Kg</option>
            <option value="MtoKm">m a km</option>
            <option value="KmtoM">km a m</option>
        </select>
        
        <button id="convertir">Convertir</button>
            
        <p id="resultado"></p>
    </div>

   <script src="script.js"></script>
</body>
</html>
